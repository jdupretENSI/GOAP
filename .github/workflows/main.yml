name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.3.1). Defaults to "dev".'
        required: false
        default: 'dev'
      push_to_itch:
        description: 'Push to itch.io after build'
        required: false
        default: 'false'

env:
  UNITY_VERSION: 6000.3.10f1
  BUILD_ROOT: Build/Windows
  ITCH_TARGET: jdupretENSI/goap:windows

jobs:
  # ------------------------------------------------------------------
  # 1. Acquire a Unity Personal license online and update the secret.
  #    Runs on every workflow trigger. Requires UNITY_EMAIL, UNITY_PASSWORD,
  #    and a PAT in GH_PAT with "secrets:write" for this repo.
  # ------------------------------------------------------------------
  acquire_license:
    name: Acquire Unity License
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Activate Unity license
        run: unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}"

      - name: Read generated .ulf file
        id: ulf
        uses: juliangruber/read-file-action@v1
        with:
          path: ./Unity_lic.ulf

      - name: Update UNITY_LICENSE secret
        uses: hmanzur/actions-set-secret@v2.1.0
        with:
          name: 'UNITY_LICENSE'
          value: '${{ steps.ulf.outputs.content }}'
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_PAT }}

  # ------------------------------------------------------------------
  # 2. Build the Windows player.
  # ------------------------------------------------------------------
  build:
    name: Build Windows player
    needs: acquire_license
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          CLEAN="${RAW#v}"
          CLEAN="${CLEAN#V}"
          echo "raw=$RAW"       >> "$GITHUB_OUTPUT"
          echo "clean=$CLEAN"   >> "$GITHUB_OUTPUT"
          echo "Version: $RAW -> $CLEAN"

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          PROJECT_VERSION: ${{ steps.ver.outputs.raw }}
          PROJECT_SHA: ${{ github.sha }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildMethod: Goap.BuildTools.BuildRunner.BuildWindows
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.ver.outputs.clean }}
          path: ${{ env.BUILD_ROOT }}/${{ steps.ver.outputs.clean }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. Push the build to itch.io.
  # ------------------------------------------------------------------
  publish:
    name: Publish to itch.io
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.push_to_itch == 'true'

    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          CLEAN="${RAW#v}"
          CLEAN="${CLEAN#V}"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ steps.ver.outputs.clean }}
          path: build

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push build "${{ env.ITCH_TARGET }}" --userversion "${{ steps.ver.outputs.clean }}"
