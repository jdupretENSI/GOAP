name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.3.1). Defaults to "dev".'
        required: false
        default: 'dev'
      push_to_itch:
        description: 'Push to itch.io after build'
        required: false
        type: boolean
        default: true

# Cancel superseded runs on the same ref instead of burning build minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.10f1
  # Public stable channel — used for main pushes, tag pushes, and manual
  # publishes with a semver version.
  ITCH_TARGET_RELEASE: jdupretENSI/goap:windows
  # Dev channel — only reachable via manual dispatch with a non-semver version.
  ITCH_TARGET_DEV: jdupretENSI/goap:windows-dev

jobs:
  # ------------------------------------------------------------------
  # 0. Fail fast: verify every secret, tool and project precondition.
  # ------------------------------------------------------------------
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.clean }}
      raw_version: ${{ steps.ver.outputs.raw }}
      publish: ${{ steps.decide.outputs.publish }}
      itch_target: ${{ steps.decide.outputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No LFS needed for static validation; keeps preflight cheap.
          lfs: false

      - name: Validate required secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          INPUT_PUSH: ${{ github.event.inputs.push_to_itch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          require() {
            local name="$1" value="$2"
            if [ -z "${value:-}" ]; then
              echo "::error title=Missing secret::Secret '$name' is not set or is empty. Add it in Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "OK: $name is set"
            fi
          }

          # Unity activation: either a .ulf license, or serial + credentials.
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "OK: UNITY_LICENSE is set"
          else
            echo "::notice::UNITY_LICENSE not set - falling back to serial-based activation."
            require UNITY_SERIAL "$UNITY_SERIAL"
            require UNITY_EMAIL  "$UNITY_EMAIL"
            require UNITY_PASSWORD "$UNITY_PASSWORD"
          fi

          # Butler is needed whenever we publish. On this workflow that's:
          #   - any tag push
          #   - any push to main
          #   - manual dispatch with push_to_itch (default true)
          WILL_PUBLISH=false
          if [ "$REF_TYPE" = "tag" ]; then
            WILL_PUBLISH=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            WILL_PUBLISH=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_PUSH:-true}" = "true" ]; then
            WILL_PUBLISH=true
          fi
          if [ "$WILL_PUBLISH" = "true" ]; then
            require BUTLER_API_KEY "$BUTLER_API_KEY"
          else
            echo "Skipping BUTLER_API_KEY check (publish disabled for this run)."
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Preflight failed - one or more required secrets are missing."
            exit 1
          fi

      - name: Validate Unity project layout
        env:
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          for f in ProjectSettings/ProjectVersion.txt Packages/manifest.json Assets; do
            if [ ! -e "$f" ]; then
              echo "::error title=Missing project file::'$f' not found. Is the workflow running at the Unity project root?"
              exit 1
            fi
            echo "OK: found $f"
          done

          FILE_VERSION=$(sed -n 's/^m_EditorVersion: *//p' ProjectSettings/ProjectVersion.txt | tr -d '\r' | head -1)
          if [ "$FILE_VERSION" != "$UNITY_VERSION" ]; then
            echo "::error title=Unity version mismatch::ProjectSettings/ProjectVersion.txt declares '$FILE_VERSION' but the workflow UNITY_VERSION is '$UNITY_VERSION'."
            exit 1
          fi
          echo "OK: Unity version $UNITY_VERSION matches ProjectSettings."

      - name: Validate build entry point
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rqE 'class[[:space:]]+BuildRunner' Assets --include='*.cs'; then
            echo "::error title=Missing build entry point::Goap.BuildTools.BuildRunner was not found under Assets/. game-ci will fail."
            exit 1
          fi
          if ! grep -rqE 'static[[:space:]]+void[[:space:]]+BuildWindows' Assets --include='*.cs'; then
            echo "::error title=Missing build method::Goap.BuildTools.BuildRunner.BuildWindows was not found under Assets/."
            exit 1
          fi
          echo "OK: build entry point Goap.BuildTools.BuildRunner.BuildWindows found."

      - name: Resolve and validate version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"

          if [ "$REF_TYPE" = "tag" ]; then
            # Tag push: authoritative. v0.3.1 -> 0.3.1
            RAW="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="${INPUT_VERSION:-dev}"
          else
            # Push to main. main is the shippable branch, so we don't want a
            # "dev-..." version string on the public itch channel. Instead
            # read bundleVersion from ProjectSettings.asset and append the
            # commit short-SHA as semver build metadata.
            BUNDLE=$(sed -n 's/^  bundleVersion: *//p' ProjectSettings/ProjectSettings.asset | tr -d '\r' | head -1)
            if [ -z "$BUNDLE" ]; then
              echo "::error title=Missing bundleVersion::Could not read bundleVersion from ProjectSettings/ProjectSettings.asset."
              exit 1
            fi
            RAW="${BUNDLE}+${SHORT}"
          fi

          CLEAN="${RAW#v}"
          CLEAN="${CLEAN#V}"

          if [ -z "$CLEAN" ]; then
            echo "::error title=Invalid version::Version resolved to an empty string (raw='$RAW')."
            exit 1
          fi

          # Allowed: letters, digits, '.', '_', '+', '-'. Must start alphanumeric.
          if ! printf '%s' "$CLEAN" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._+-]*$'; then
            echo "::error title=Invalid version::'$CLEAN' is not a usable version string. Allowed characters: letters, digits, '.', '_', '+', '-' (must start alphanumeric)."
            exit 1
          fi

          echo "raw=$RAW"     >> "$GITHUB_OUTPUT"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved version: '$RAW' -> '$CLEAN'"

      - name: Validate itch.io targets
        env:
          RELEASE_TARGET: ${{ env.ITCH_TARGET_RELEASE }}
          DEV_TARGET: ${{ env.ITCH_TARGET_DEV }}
        shell: bash
        run: |
          set -euo pipefail

          validate_target() {
            local label="$1" t="$2"
            if ! printf '%s' "$t" | grep -Eq '^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'; then
              echo "::error title=Invalid $label::'$t' does not match 'user/game:channel'."
              exit 1
            fi
            echo "OK: $label '$t' is well formed."
          }

          validate_target ITCH_TARGET_RELEASE "$RELEASE_TARGET"
          validate_target ITCH_TARGET_DEV     "$DEV_TARGET"

      - name: Decide whether to publish
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUSH: ${{ github.event.inputs.push_to_itch }}
          VERSION: ${{ steps.ver.outputs.clean }}
          RELEASE_TARGET: ${{ env.ITCH_TARGET_RELEASE }}
          DEV_TARGET: ${{ env.ITCH_TARGET_DEV }}
        run: |
          set -euo pipefail

          PUBLISH=false
          TARGET="$RELEASE_TARGET"

          if [ "$REF_TYPE" = "tag" ]; then
            # Tag push: public release.
            PUBLISH=true
            TARGET="$RELEASE_TARGET"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            # Push to main: public release on the stable channel.
            PUBLISH=true
            TARGET="$RELEASE_TARGET"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_PUSH:-true}" = "true" ]; then
            # Manual: publish by default. Semver -> public, otherwise dev.
            PUBLISH=true
            if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
              TARGET="$RELEASE_TARGET"
            else
              TARGET="$DEV_TARGET"
            fi
          else
            PUBLISH=false
          fi

          if [ "$PUBLISH" = "true" ] && [ "$VERSION" = "dev" ]; then
            echo "::error title=Refusing to publish 'dev'::Use a real version (tag or manual input) when publishing."
            exit 1
          fi

          echo "publish=$PUBLISH"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"     >> "$GITHUB_OUTPUT"
          echo "Publish: $PUBLISH -> $TARGET"

      - name: Preflight summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RAW: ${{ steps.ver.outputs.raw }}
          CLEAN: ${{ steps.ver.outputs.clean }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
          TARGET: ${{ steps.decide.outputs.itch_target }}
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
        run: |
          {
            echo "## Preflight OK"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$EVENT_NAME\` (\`$REF_TYPE\` \`$REF_NAME\`) |"
            echo "| Raw version | \`$RAW\` |"
            echo "| Clean version | \`$CLEAN\` |"
            echo "| Unity version | \`$UNITY_VERSION\` |"
            echo "| itch target | \`$TARGET\` |"
            echo "| Will publish | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 1. Build the Windows player.
  # ------------------------------------------------------------------
  build:
    name: Build Windows player
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - name: Build
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildMethod: Goap.BuildTools.BuildRunner.BuildWindows
          allowDirtyBuild: true
          customParameters: >
            -buildVersion "${{ needs.preflight.outputs.version }}"
            -buildSha "${{ github.sha }}"

      - name: Locate build output
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          echo "PWD: $(pwd)"
          echo "--- Build/ ---"
          find Build -maxdepth 3 2>/dev/null || true

          INFO=$(find Build/Windows -maxdepth 2 -name build-info.txt -printf '%T@ %p\n' \
                 | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$INFO" ]; then
            echo "::error::No build-info.txt found under Build/Windows/."
            exit 1
          fi

          DIR=$(dirname "$INFO")
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR")" ]; then
            echo "::error::Resolved build directory '$DIR' is empty."
            exit 1
          fi

          echo "resolved=$DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact path: $DIR"
          cat "$INFO"

      - name: Zip build output
        id: zip
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          DIR="${{ steps.locate.outputs.resolved }}"
          # Sanitize '+' for a filename-safe zip name.
          SAFE=$(printf '%s' "$VERSION" | tr '+' '_')
          OUT="windows-${SAFE}.zip"
          # Zip the *contents* of the build folder, so extracting the
          # archive drops the .exe and _Data/ at the root, not nested.
          ( cd "$DIR" && zip -qr "$OLDPWD/$OUT" . )
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.preflight.outputs.version }}
          path: |
            ${{ steps.locate.outputs.resolved }}
            ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # 2. Push the build to itch.io.
  #    - tag pushes          -> :windows (public)
  #    - main pushes         -> :windows (public)
  #    - manual + push_to_itch (default true) -> :windows if semver,
  #                                              :windows-dev otherwise
  # ------------------------------------------------------------------
  publish:
    name: Publish to itch.io
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.preflight.outputs.publish == 'true'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.preflight.outputs.version }}
          path: build

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A build)" ]; then
            echo "::error::Downloaded artifact 'windows-${{ needs.preflight.outputs.version }}' is empty."
            exit 1
          fi
          echo "Artifact contents:"
          find build -maxdepth 2 | head -50

      - name: Install butler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ needs.preflight.outputs.itch_target }}
        run: |
          set -euo pipefail
          echo "Pushing build/ -> $TARGET @ $VERSION"
          # The artifact contains both the unpacked folder and the zip.
          # Exclude the zip so players don't see a redundant nested archive,
          # and exclude build-info.txt so CI metadata isn't shipped.
          ./butler push build "$TARGET" --userversion "$VERSION" \
            --ignore "*.zip" \
            --ignore "build-info.txt"

  # ------------------------------------------------------------------
  # 3. GitHub Release.
  #    - main pushes -> synthetic tag "main-<sha7>", marked latest
  #    - tag pushes  -> the tag itself, marked latest
  # ------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag')
      || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.preflight.outputs.version }}
          path: dist

      - name: Locate zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find dist -maxdepth 1 -name 'windows-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "::error::No windows-*.zip found in downloaded artifact."
            exit 1
          fi
          echo "path=$ZIP"                >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")"  >> "$GITHUB_OUTPUT"

      - name: Resolve release tag and title
        id: tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="Release $VERSION"
          else
            # main push — anchor the release to a synthetic tag.
            TAG="main-${SHORT}"
            TITLE="Build $VERSION"
          fi

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows build for **${{ github.ref_name }}**.

            - Version: `${{ needs.preflight.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - itch.io: https://jdupretensi.itch.io/goap
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
