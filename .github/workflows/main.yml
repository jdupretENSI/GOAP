name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.3.1). Leave empty to use the project version.'
        required: false
        default: ''
      push_to_itch:
        description: 'Push to itch.io after build'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.10f1
  ITCH_TARGET_RELEASE: jdupretENSI/goap:windows
  ITCH_TARGET_DEV: jdupretENSI/goap:windows-dev

jobs:
  # ------------------------------------------------------------------
  # 0. Fail fast: verify every secret, tool and project precondition.
  #    Also extracts the game name and version from the Unity project
  #    so every downstream job uses a single source of truth.
  # ------------------------------------------------------------------
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      raw_version: ${{ steps.meta.outputs.raw_version }}
      game_name: ${{ steps.meta.outputs.game_name }}
      game_key: ${{ steps.meta.outputs.game_key }}
      publish: ${{ steps.decide.outputs.publish }}
      itch_target: ${{ steps.decide.outputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate required secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          INPUT_PUSH: ${{ github.event.inputs.push_to_itch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          require() {
            local name="$1" value="$2"
            if [ -z "${value:-}" ]; then
              echo "::error title=Missing secret::Secret '$name' is not set or is empty. Add it in Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "OK: $name is set"
            fi
          }

          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "OK: UNITY_LICENSE is set"
          else
            echo "::notice::UNITY_LICENSE not set - falling back to serial-based activation."
            require UNITY_SERIAL "$UNITY_SERIAL"
            require UNITY_EMAIL  "$UNITY_EMAIL"
            require UNITY_PASSWORD "$UNITY_PASSWORD"
          fi

          WILL_PUBLISH=false
          if [ "$REF_TYPE" = "tag" ]; then
            WILL_PUBLISH=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            WILL_PUBLISH=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_PUSH:-true}" = "true" ]; then
            WILL_PUBLISH=true
          fi
          if [ "$WILL_PUBLISH" = "true" ]; then
            require BUTLER_API_KEY "$BUTLER_API_KEY"
          else
            echo "Skipping BUTLER_API_KEY check (publish disabled for this run)."
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Preflight failed - one or more required secrets are missing."
            exit 1
          fi

      - name: Validate Unity project layout
        env:
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          for f in ProjectSettings/ProjectVersion.txt ProjectSettings/ProjectSettings.asset Packages/manifest.json Assets; do
            if [ ! -e "$f" ]; then
              echo "::error title=Missing project file::'$f' not found. Is the workflow running at the Unity project root?"
              exit 1
            fi
            echo "OK: found $f"
          done

          FILE_VERSION=$(sed -n 's/^m_EditorVersion: *//p' ProjectSettings/ProjectVersion.txt | tr -d '\r' | head -1)
          if [ "$FILE_VERSION" != "$UNITY_VERSION" ]; then
            echo "::error title=Unity version mismatch::ProjectSettings/ProjectVersion.txt declares '$FILE_VERSION' but the workflow UNITY_VERSION is '$UNITY_VERSION'."
            exit 1
          fi
          echo "OK: Unity version $UNITY_VERSION matches ProjectSettings."

      - name: Validate build entry point
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rqE 'class[[:space:]]+BuildRunner' Assets --include='*.cs'; then
            echo "::error title=Missing build entry point::Goap.BuildTools.BuildRunner was not found under Assets/. game-ci will fail."
            exit 1
          fi
          if ! grep -rqE 'static[[:space:]]+void[[:space:]]+BuildWindows' Assets --include='*.cs'; then
            echo "::error title=Missing build method::Goap.BuildTools.BuildRunner.BuildWindows was not found under Assets/."
            exit 1
          fi
          echo "OK: build entry point Goap.BuildTools.BuildRunner.BuildWindows found."

      - name: Extract game name and version from project
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.sha }}
          SETTINGS: ProjectSettings/ProjectSettings.asset
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"

          # ---- productName: the human-facing game title -------------------
          GAME_NAME=$(sed -n 's/^  productName: *//p' "$SETTINGS" | tr -d '\r' | head -1)
          # Strip optional surrounding quotes if Unity wrote any.
          GAME_NAME="${GAME_NAME%\"}"
          GAME_NAME="${GAME_NAME#\"}"

          if [ -z "$GAME_NAME" ]; then
            echo "::error title=Missing productName::Could not read 'productName' from $SETTINGS. Expected a line like '  productName: My Game'."
            exit 1
          fi

          # ---- version ---------------------------------------------------
          BUNDLE=$(sed -n 's/^  bundleVersion: *//p' "$SETTINGS" | tr -d '\r' | head -1)
          BUNDLE="${BUNDLE%\"}"
          BUNDLE="${BUNDLE#\"}"

          if [ -z "$BUNDLE" ]; then
            echo "::error title=Missing bundleVersion::Could not read 'bundleVersion' from $SETTINGS. Expected a line like '  bundleVersion: 0.3.1'."
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            RAW="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="${BUNDLE}+${SHORT}"
          fi

          CLEAN="${RAW#v}"
          CLEAN="${CLEAN#V}"

          if [ -z "$CLEAN" ]; then
            echo "::error title=Invalid version::Version resolved to an empty string (raw='$RAW')."
            exit 1
          fi
          if ! printf '%s' "$CLEAN" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._+-]*$'; then
            echo "::error title=Invalid version::'$CLEAN' is not a usable version string (allowed: letters, digits, '.', '_', '+', '-'; must start alphanumeric)."
            exit 1
          fi

          # ---- sanitized key: replace every char outside [A-Za-z0-9._-] --
          #      with '-'. Case is preserved, consecutive illegal chars
          #      become consecutive dashes (kept as-is so the transform is
          #      a straight character-for-character substitution).
          GAME_KEY=$(printf '%s' "$GAME_NAME" | sed -E 's/[^A-Za-z0-9._-]/-/g')

          # Trim leading/trailing dashes and collapse repeats so we never
          # end up with "Goap-" or "My--Game" as an identifier.
          GAME_KEY=$(printf '%s' "$GAME_KEY" | sed -E 's/^-+//; s/-+$//; s/-{2,}/-/g')

          if [ -z "$GAME_KEY" ]; then
            echo "::error title=Empty game key::Could not derive a usable identifier from productName '$GAME_NAME'."
            exit 1
          fi

          echo "game_name=$GAME_NAME"   >> "$GITHUB_OUTPUT"
          echo "game_key=$GAME_KEY"     >> "$GITHUB_OUTPUT"
          echo "raw_version=$RAW"       >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN"         >> "$GITHUB_OUTPUT"

          echo "Game name (raw):       $GAME_NAME"
          echo "Game key (sanitized):  $GAME_KEY"
          echo "Version:               $RAW -> $CLEAN"

      - name: Validate itch.io targets
        env:
          RELEASE_TARGET: ${{ env.ITCH_TARGET_RELEASE }}
          DEV_TARGET: ${{ env.ITCH_TARGET_DEV }}
        shell: bash
        run: |
          set -euo pipefail

          validate_target() {
            local label="$1" t="$2"
            if ! printf '%s' "$t" | grep -Eq '^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'; then
              echo "::error title=Invalid $label::'$t' does not match 'user/game:channel'."
              exit 1
            fi
            echo "OK: $label '$t' is well formed."
          }

          validate_target ITCH_TARGET_RELEASE "$RELEASE_TARGET"
          validate_target ITCH_TARGET_DEV     "$DEV_TARGET"

      - name: Decide whether to publish
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUSH: ${{ github.event.inputs.push_to_itch }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TARGET: ${{ env.ITCH_TARGET_RELEASE }}
          DEV_TARGET: ${{ env.ITCH_TARGET_DEV }}
        run: |
          set -euo pipefail

          PUBLISH=false
          TARGET="$RELEASE_TARGET"

          if [ "$REF_TYPE" = "tag" ]; then
            PUBLISH=true
            TARGET="$RELEASE_TARGET"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            PUBLISH=true
            TARGET="$RELEASE_TARGET"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_PUSH:-true}" = "true" ]; then
            PUBLISH=true
            if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
              TARGET="$RELEASE_TARGET"
            else
              TARGET="$DEV_TARGET"
            fi
          else
            PUBLISH=false
          fi

          if [ "$PUBLISH" = "true" ] && [ "$VERSION" = "dev" ]; then
            echo "::error title=Refusing to publish 'dev'::Use a real version (tag or manual input) when publishing."
            exit 1
          fi

          echo "publish=$PUBLISH"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"     >> "$GITHUB_OUTPUT"
          echo "Publish: $PUBLISH -> $TARGET"

      - name: Preflight summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GAME_NAME: ${{ steps.meta.outputs.game_name }}
          GAME_KEY: ${{ steps.meta.outputs.game_key }}
          RAW: ${{ steps.meta.outputs.raw_version }}
          CLEAN: ${{ steps.meta.outputs.version }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
          TARGET: ${{ steps.decide.outputs.itch_target }}
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
        run: |
          {
            echo "## Preflight OK"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$EVENT_NAME\` (\`$REF_TYPE\` \`$REF_NAME\`) |"
            echo "| Game name | \`$GAME_NAME\` |"
            echo "| Game key | \`$GAME_KEY\` |"
            echo "| Raw version | \`$RAW\` |"
            echo "| Clean version | \`$CLEAN\` |"
            echo "| Unity version | \`$UNITY_VERSION\` |"
            echo "| itch target | \`$TARGET\` |"
            echo "| Will publish | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 1. Build the Windows player.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ needs.preflight.outputs.game_name }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - name: Build
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildMethod: Goap.BuildTools.BuildRunner.BuildWindows
          allowDirtyBuild: true
          customParameters: >
            -buildVersion "${{ needs.preflight.outputs.version }}"
            -buildSha "${{ github.sha }}"

      - name: Locate build output
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          echo "PWD: $(pwd)"
          echo "--- Build/ ---"
          find Build -maxdepth 3 2>/dev/null || true

          INFO=$(find Build/Windows -maxdepth 2 -name build-info.txt -printf '%T@ %p\n' \
                 | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$INFO" ]; then
            echo "::error::No build-info.txt found under Build/Windows/."
            exit 1
          fi

          DIR=$(dirname "$INFO")
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR")" ]; then
            echo "::error::Resolved build directory '$DIR' is empty."
            exit 1
          fi

          echo "resolved=$DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact path: $DIR"
          cat "$INFO"

      - name: Zip build output
        id: zip
        shell: bash
        env:
          GAME_KEY: ${{ needs.preflight.outputs.game_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          DIR="${{ steps.locate.outputs.resolved }}"
          # Filename-safe: sanitize '+' (semver build metadata) to '_'.
          SAFE=$(printf '%s' "$VERSION" | tr '+' '_')
          OUT="${GAME_KEY}-windows-${SAFE}.zip"
          ( cd "$DIR" && zip -qr "$OLDPWD/$OUT" . )
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.game_key }}-windows-${{ needs.preflight.outputs.version }}
          path: |
            ${{ steps.locate.outputs.resolved }}
            ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # 2. Push the build to itch.io.
  # ------------------------------------------------------------------
  publish:
    name: Publish ${{ needs.preflight.outputs.game_name }} to itch.io
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.preflight.outputs.publish == 'true'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.game_key }}-windows-${{ needs.preflight.outputs.version }}
          path: build

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(ls -A build)" ]; then
            echo "::error::Downloaded artifact is empty."
            exit 1
          fi
          echo "Artifact contents:"
          find build -maxdepth 2 | head -50

      - name: Install butler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ needs.preflight.outputs.itch_target }}
          GAME_NAME: ${{ needs.preflight.outputs.game_name }}
        run: |
          set -euo pipefail
          echo "Pushing '$GAME_NAME' ($VERSION) -> $TARGET"
          ./butler push build "$TARGET" --userversion "$VERSION" \
            --ignore "*.zip" \
            --ignore "build-info.txt"

  # ------------------------------------------------------------------
  # 3. GitHub Release.
  # ------------------------------------------------------------------
  release:
    name: GitHub Release — ${{ needs.preflight.outputs.game_name }}
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag')
      || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.game_key }}-windows-${{ needs.preflight.outputs.version }}
          path: dist

      - name: Locate zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "::error::No *.zip found in downloaded artifact."
            exit 1
          fi
          echo "path=$ZIP"                >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")"  >> "$GITHUB_OUTPUT"

      - name: Resolve release tag and title
        id: tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          GAME_NAME: ${{ needs.preflight.outputs.game_name }}
          GAME_KEY: ${{ needs.preflight.outputs.game_key }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="${GAME_NAME} ${VERSION}"
          else
            TAG="${GAME_KEY}-main-${SHORT}"
            TITLE="${GAME_NAME} ${VERSION}"
          fi

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release tag:   $TAG"
          echo "Release title: $TITLE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ needs.preflight.outputs.game_name }} — Windows build.

            - Version: `${{ needs.preflight.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - itch.io: https://jdupretensi.itch.io/goap
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
